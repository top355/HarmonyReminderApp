name: Build HarmonyOS HAP

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Setup HarmonyOS SDK
        uses: ErBWs/setup-ohos@v2
        with:
          version: "6.1.1.280"
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configure npm registry for hvigor
        run: |
          echo 'registry=https://repo.huaweicloud.com/repository/npm/' > ~/.npmrc
          echo '@ohos:registry=https://repo.harmonyos.com/npm/' >> ~/.npmrc
          echo 'strict-ssl=false' >> ~/.npmrc

      - name: Configure environment
        run: |
          echo "DEVECO_SDK_HOME=$HOME/ohos-sdk/command-line-tools/sdk" >> $GITHUB_ENV
          echo "HOS_SDK_HOME=$HOME/ohos-sdk/command-line-tools/sdk" >> $GITHUB_ENV

      - name: Configure ohpm registry
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm config set strict_ssl false

      - name: Install project dependencies
        run: ohpm install --all

      - name: Build HAP (debug)
        env:
          DEVECO_SDK_HOME: ${{ env.DEVECO_SDK_HOME }}
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-reminder-hap
          path: entry/build/default/outputs/default/*.hap
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: entry/build/default/outputs/default/*.hap
          generate_release_notes: true
